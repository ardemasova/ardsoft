<script>
(function(){
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function render(lang){
    const L = LEGAL[lang] || LEGAL.en;
    const date = new Date(COMPANY.updated + "T12:00:00").toLocaleDateString(lang, {year:"numeric", month:"long", day:"numeric"});
    const val = k => {
      const v = k === "updated" ? date : COMPANY[k];
      if (v === undefined) return "{" + k + "}";
      return v.startsWith("[") ? '<span class="ph">' + esc(v) + "</span>" : esc(v);
    };
    const fillHtml = s => s.replace("{UPD}", L.upd).replace(/<dt>[^<]*<\/dt><dd>[^<]*\{(\w+)\}[^<]*<\/dd>/g, (m, k) => (k in COMPANY || k === "updated") ? m : "").replace(/\{(\w+)\}/g, (m, k) => val(k));
    ["legal","privacy","cookies"].forEach(id => { document.getElementById(id).innerHTML = fillHtml(L[id]); });
  }
  ArdSoft.onLang(render);
  if (location.hash) { const el = document.querySelector(location.hash); if (el) setTimeout(() => el.scrollIntoView(), 50); }
})();
</script>
